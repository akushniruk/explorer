services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://nexus:password@postgres:5432/nexus
      YELLOW_API_URL: wss://clearnet.yellow.com/ws
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://nexus:password@postgres:5432/nexus
      YELLOW_API_URL: wss://clearnet.yellow.com/ws
      OFFCHAIN_SYNC_ENABLED: "true"
      ONCHAIN_INDEXER_ENABLED: "false"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node dist/src/worker.js' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker-onchain:
    build:
      context: .
      dockerfile: Dockerfile.worker.onchain
    environment:
      DATABASE_URL: postgresql://nexus:password@postgres:5432/nexus
      OFFCHAIN_SYNC_ENABLED: "false"
      ONCHAIN_INDEXER_ENABLED: "true"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node dist/src/worker-onchain.js' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
